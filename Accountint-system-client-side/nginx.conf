server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Main rule: serve static files if they exist, otherwise fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: serve assets explicitly with correct MIME types
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Optional: serve images explicitly with caching
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Error pages (useful to avoid nginx default ugly 404/50x pages)
    error_page 404 /index.html;
}
